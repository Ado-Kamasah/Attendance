<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Attendance tracking system for Southshore University College.">
    <!-- Open Graph Tags for better link sharing -->
    <meta property="og:title" content="Southshore University Attendance">
    <meta property="og:description" content="Modern tracking portal for Southshore University College.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Southshore University College - Attendance</title>
    
    <style>
      /* Initial zero-state preloader styles */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #f8fafc; /* Sleek light background fallback */
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: white;
        font-family: 'Inter', sans-serif;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6; /* Modern distinct blue */
        animation: spin 1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        margin-bottom: 24px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .preloader-title {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        animation: pulse 2s infinite ease-in-out;
      }
      .preloader-subtitle {
        font-size: 0.875rem;
        color: #94a3b8; /* Slate-400 */
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-preloader">
        <div class="spinner"></div>
        <div class="preloader-title">Southshore University</div>
        <div class="preloader-subtitle">Loading System...</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
