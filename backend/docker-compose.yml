version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: attendance-postgres
    restart: always
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_password
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
